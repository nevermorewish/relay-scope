<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RelayScope 正在启动</title>
    <link rel="icon" href="relayscope-desktop.png" type="image/png" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      }
      body {
        align-items: center;
        background: #f5f7f8;
        color: #1f2933;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }
      main {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      img {
        height: 72px;
        width: 72px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0;
        margin: 0;
      }
      .spinner {
        animation: spin 0.8s linear infinite;
        border: 3px solid #c9d1d8;
        border-radius: 50%;
        border-top-color: #1677ff;
        height: 22px;
        width: 22px;
      }
      p {
        color: #5b6773;
        font-size: 14px;
        letter-spacing: 0;
        margin: 0;
      }
      button {
        background: #1677ff;
        border: 0;
        border-radius: 6px;
        color: #fff;
        cursor: pointer;
        display: none;
        font: inherit;
        padding: 8px 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        body { background: #171a1d; color: #f3f5f7; }
        p { color: #aab4bd; }
        .spinner { border-color: #46515b; border-top-color: #4096ff; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="relayscope-desktop.png" alt="" />
      <h1>RelayScope</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status">正在启动监测台...</p>
      <button id="retry" type="button">重试</button>
    </main>
    <script>
      const target = "http://127.0.0.1:3000";
      const startedAt = Date.now();
      const restartDelay = new URLSearchParams(window.location.search).has("restart")
        ? 1500
        : 0;
      const status = document.querySelector("#status");
      const retry = document.querySelector("#retry");

      async function waitUntilReady() {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 750);
        try {
          const response = await fetch(`${target}/api/auth/health?launcher=${Date.now()}`, {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!response.ok) throw new Error("RelayScope is not ready");
          await response.text();
          window.location.replace(target);
        } catch {
          if (Date.now() - startedAt > 45000) {
            status.textContent = "启动时间较长，请重试";
            retry.style.display = "block";
            return;
          }
          window.setTimeout(waitUntilReady, 150);
        } finally {
          window.clearTimeout(timeout);
        }
      }

      retry.addEventListener("click", () => window.location.reload());
      window.setTimeout(waitUntilReady, restartDelay);
    </script>
  </body>
</html>
